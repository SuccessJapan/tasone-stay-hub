<body>

<header>
  <h1>宿泊施設一覧</h1>
  <p>気になる施設を選んで、ご予約サイトへお進みください</p>
</header>

<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="施設名・エリアで検索">
  </div>
  <div class="filter-row" id="areaFilters"></div>
  <div class="filter-row" id="typeFilters"></div>
  <div class="filter-row" id="conceptFilters"></div>
</div>
<div class="count-line" id="countLine"></div>

<main id="list">
  <div class="loading">読み込み中です…</div>
</main>

<footer>掲載施設のご予約は、各予約サイトの表記条件に従います。</footer>

<script>
/* ===== 設定エリア：ここだけ差し替えればOK ===== */
const SHEET_ID = "1wp9jcPua0qtx7t3RXplfLnOfaYfF1WMCsFGeO7m_Iwk"; // GoogleスプレッドシートのID
const GID = "0"; // シートのgid（最初のシートは通常0）
/* =========================================== */

const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

const COLS = {
  name: "施設名",
  area: "エリア",
  type: "タイプ",
  concept: "コンセプト",
  image: "画像URL",
  direct: "自社予約リンク",
  airbnb: "Airbnbリンク",
  booking: "Booking.comリンク",
  trip: "Trip.comリンク",
  agoda: "Agodaリンク",
  order: "表示順"
};

// エリア・コンセプト列は「難波,大阪市」のようにカンマ（全角可）区切りで複数入力できます
function splitTags(str){
  return normalize(str)
    .split(/[,、]/)
    .map(s => s.trim())
    .filter(Boolean);
}

const OTA_LABELS = [
  { key: "direct",  label: "自社サイトで予約", cls: "direct" },
  { key: "airbnb",  label: "Airbnbで予約",      cls: "" },
  { key: "booking", label: "Booking.comで予約", cls: "" },
  { key: "trip",    label: "Trip.comで予約",    cls: "" },
  { key: "agoda",   label: "Agodaで予約",       cls: "" }
];

let allRows = [];
let activeArea = "すべて";
let activeType = "すべて";
let activeConcept = "すべて";
let searchTerm = "";

function normalize(str){ return (str || "").toString().trim(); }

async function loadData(){
  try{
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error("fetch failed");
    const text = await res.text();
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    allRows = parsed.data
      .map(r => ({
        name: normalize(r[COLS.name]),
        areaTags: splitTags(r[COLS.area]),
        type: normalize(r[COLS.type]),
        conceptTags: splitTags(r[COLS.concept]),
        image: normalize(r[COLS.image]),
        direct: normalize(r[COLS.direct]),
        airbnb: normalize(r[COLS.airbnb]),
        booking: normalize(r[COLS.booking]),
        trip: normalize(r[COLS.trip]),
        agoda: normalize(r[COLS.agoda]),
        order: parseFloat(r[COLS.order]) || 9999
      }))
      .map(r => ({ ...r, area: r.areaTags[0] || "" })) // カード表示用の代表エリア（1つ目の値）
      .filter(r => r.name)
      .sort((a,b) => a.order - b.order);

    buildFilters();
    render();
  }catch(e){
    document.getElementById("list").innerHTML =
      '<div class="error">一覧を読み込めませんでした。時間をおいて再度お試しください。</div>';
  }
}

function buildFilters(){
  const areas = ["すべて", ...new Set(allRows.flatMap(r => r.areaTags))];
  const types = ["すべて", ...new Set(allRows.map(r => r.type).filter(Boolean))];
  const concepts = [...new Set(allRows.flatMap(r => r.conceptTags))];

  const areaWrap = document.getElementById("areaFilters");
  areaWrap.innerHTML = areas.map(a =>
    `<button class="chip${a===activeArea?" active":""}" data-kind="area" data-val="${a}">${a}</button>`
  ).join("");

  const typeWrap = document.getElementById("typeFilters");
  typeWrap.innerHTML = types.map(t =>
    `<button class="chip${t===activeType?" active":""}" data-kind="type" data-val="${t}">${t}</button>`
  ).join("");

  // コンセプトタグが1件もなければ、この行自体を表示しない
  const conceptWrap = document.getElementById("conceptFilters");
  if(concepts.length === 0){
    conceptWrap.innerHTML = "";
  }else{
    const conceptOptions = ["すべて", ...concepts];
    conceptWrap.innerHTML = conceptOptions.map(c =>
      `<button class="chip${c===activeConcept?" active":""}" data-kind="concept" data-val="${c}">${c === "すべて" ? c : "🎤 " + c}</button>`
    ).join("");
  }

  document.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const kind = btn.dataset.kind;
      const val = btn.dataset.val;
      if(kind === "area") activeArea = val;
      if(kind === "type") activeType = val;
      if(kind === "concept") activeConcept = val;
      buildFilters();
      render();
    });
  });
}

function matches(r){
  const term = searchTerm.trim();
  const inArea = activeArea === "すべて" || r.areaTags.includes(activeArea);
  const inType = activeType === "すべて" || r.type === activeType;
  const inConcept = activeConcept === "すべて" || r.conceptTags.includes(activeConcept);
  const haystack = r.name + r.areaTags.join("") + r.conceptTags.join("");
  const inSearch = !term || haystack.includes(term);
  return inArea && inType && inConcept && inSearch;
}

function render(){
  const filtered = allRows.filter(matches);
  document.getElementById("countLine").textContent = `${filtered.length}件の施設`;

  const list = document.getElementById("list");
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">該当する施設が見つかりませんでした。</div>';
    return;
  }

  list.innerHTML = filtered.map((r, i) => {
    const thumbStyle = r.image ? `style="background-image:url('${r.image}')"` : "";
    const tags = [r.area, r.type, ...r.conceptTags].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join("");
    const buttons = OTA_LABELS
      .filter(o => r[o.key])
      .map(o => `<a class="book-btn ${o.cls}" href="${r[o.key]}" target="_blank" rel="noopener">${o.label}<span class="arrow">›</span></a>`)
      .join("");

    return `
      <div class="card" id="card-${i}">
        <div class="card-head" onclick="toggleCard(${i})">
          <div class="card-thumb" ${thumbStyle}></div>
          <div class="card-info">
            <p class="card-name">${r.name}</p>
            <div class="card-tags">${tags}</div>
          </div>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="card-body" id="body-${i}">
          <div class="card-body-inner">${buttons || '<p style="font-size:12.5px;color:var(--ink-soft);">現在ご予約リンクを準備中です</p>'}</div>
        </div>
      </div>`;
  }).join("");
}

function toggleCard(i){
  const card = document.getElementById(`card-${i}`);
  const body = document.getElementById(`body-${i}`);
  const isOpen = card.classList.contains("open");
  document.querySelectorAll(".card.open").forEach(c => {
    c.classList.remove("open");
    c.querySelector(".card-body").style.maxHeight = null;
  });
  if(!isOpen){
    card.classList.add("open");
    body.style.maxHeight = body.scrollHeight + "px";
  }
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  render();
});

loadData();
</script>
</body>
</html>
